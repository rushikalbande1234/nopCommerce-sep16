on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x

    - name: Checkout code
      uses: actions/checkout@v5

    - name: Restore dependencies
      run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

    - name: Build project
      run: dotnet build --configuration Debug src/Presentation/Nop.Web/Nop.Web.csproj

    - name: Run Tests and Create Results
      run: |
        dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --logger:"trx;LogFileName=TestResults/testResults.trx"
        dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --logger:"html;LogFileName=TestResults/testResults.html"
        dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --logger:"junit;LogFileName=TestResults/testResults.xml"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          src/Tests/Nop.Tests/TestResults/*.trx
          src/Tests/Nop.Tests/TestResults/*.html
          src/Tests/Nop.Tests/TestResults/*.xml

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        trx_files: 'src/Tests/Nop.Tests/TestResults/*.trx'
        junit_files: 'src/Tests/Nop.Tests/TestResults/*.xml'
        html_files: 'src/Tests/Nop.Tests/TestResults/*.html'
